<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext + Vue 3 演示 | 高性能文本布局引擎</title>
  <meta name="description" content="基于 Pretext 和 Vue 3 的高性能文本布局引擎演示项目，展示零DOM读取、实时测量和复杂文本布局功能。">
  <meta name="keywords" content="Pretext, Vue 3, 文本布局, 性能优化, 零DOM读取, Pinia, TypeScript">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  <style>
    /* 加载动画 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 1rem;
    }
    
    .loading-text {
      font-family: 'Inter', sans-serif;
      font-size: 1.125rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* 隐藏加载动画 */
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 加载动画 -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载 Pretext 演示...</div>
  </div>
  
  <!-- 应用挂载点 -->
  <div id="app"></div>
  
  <script type="module" src="/src/main.ts"></script>
  
  <script>
    // 隐藏加载动画
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden')
      }, 500)
    })
    
    // 如果应用加载失败，显示错误信息
    window.addEventListener('error', (event) => {
      console.error('应用加载错误:', event.error)
      const loading = document.getElementById('loading')
      loading.innerHTML = `
        <div style="text-align: center; padding: 2rem;">
          <div style="font-size: 3rem; margin-bottom: 1rem;">❌</div>
          <h2 style="margin-bottom: 0.5rem;">应用加载失败</h2>
          <p style="opacity: 0.8; margin-bottom: 1.5rem;">请检查控制台查看错误信息</p>
          <button onclick="location.reload()" style="
            background: white;
            color: #4f46e5;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
          ">
            重新加载
          </button>
        </div>
      `
    })
  </script>
</body>
</html>
